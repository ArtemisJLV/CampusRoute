name: 检查与构建
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  TMPDIR: ${{ github.workspace }}/work/.cache/tmp
  TEMP: ${{ github.workspace }}/work/.cache/tmp
  TMP: ${{ github.workspace }}/work/.cache/tmp
jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11—3.15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: false
      - name: 准备缓存目录
        shell: bash
        run: mkdir -p work/.cache/tmp
      - name: Python 3.11
        uses: ./.github/actions/test-python
        with:
          python-version: '3.11'
      - name: Python 3.12
        uses: ./.github/actions/test-python
        with:
          python-version: '3.12'
      - name: Python 3.13
        uses: ./.github/actions/test-python
        with:
          python-version: '3.13'
      - name: Python 3.14
        uses: ./.github/actions/test-python
        with:
          python-version: '3.14'
      - name: Python 3.15
        uses: ./.github/actions/test-python
        with:
          python-version: '3.15'
  package:
    name: Python 发行包
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: false
      - name: 准备缓存目录
        run: mkdir -p work/.cache/tmp
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distribution.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python tools/check_environment.py --backend android
      - uses: actions/upload-artifact@v7
        with:
          name: CampusRoute-python
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  android:
    name: Android 调试 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: false
      - name: 准备缓存目录
        run: mkdir -p work/.cache/tmp
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tools/build_android.py
      - uses: actions/upload-artifact@v7
        with:
          name: CampusRoute-debug
          path: build/android/CampusRoute-debug.apk
          if-no-files-found: error
          retention-days: 7
