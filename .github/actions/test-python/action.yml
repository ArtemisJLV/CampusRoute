name: Python 兼容性检查
description: 在指定 Python 版本执行源码、终端、环境与启动器检查
inputs:
  python-version:
    description: 待检查的 Python 版本
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: python -m pip install -e ".[dev,ios]"
    - shell: bash
      run: python -m ruff check src tools tests
    - shell: bash
      run: python tools/check_source.py
    - shell: bash
      run: python -m unittest discover -s tests -v
    - shell: bash
      run: python tools/check_environment.py --backend ios
    - shell: bash
      run: python -m pip check
    - shell: bash
      run: node --check src/campusroute/web/editor.js
    - name: 检查 macOS 启动脚本
      if: runner.os == 'macOS'
      shell: bash
      run: zsh -n CampusRoute.command
    - name: 验证 Windows 启动器
      if: runner.os == 'Windows'
      shell: cmd
      run: echo 0 | CampusRoute.cmd
